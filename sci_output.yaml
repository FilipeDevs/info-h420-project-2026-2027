name: adult-classifier-sci
description: SCI of the Adult income classifier (INFO-H420 project, Q2)
initialize:
  plugins:
    operational-carbon:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - energy
          - grid/carbon-intensity
        output-parameter: carbon-operational
    embodied-carbon:
      path: builtin
      method: SciEmbodied
      config:
        baseline-emissions: 307594
        lifespan: 126144000
    total-carbon:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - carbon-operational
          - embodied-carbon
        output-parameter: carbon
    sci-training:
      path: builtin
      method: Sci
      config:
        functional-unit: training-runs
    sci-inference:
      path: builtin
      method: Sci
      config:
        functional-unit: thousand-predictions
