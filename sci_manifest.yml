name: adult-classifier-sci
description: SCI of the Adult income classifier (INFO-H420 project, Q2)
initialize:
  plugins:
    operational-carbon:
      method: Multiply
      path: builtin
      config:
        input-parameters:
        - energy
        - grid/carbon-intensity
        output-parameter: carbon-operational
    embodied-carbon:
      method: SciEmbodied
      path: builtin
      config:
        baseline-emissions: 307594.0
        lifespan: 126144000
    total-carbon:
      method: Sum
      path: builtin
      config:
        input-parameters:
        - carbon-operational
        - embodied-carbon
        output-parameter: carbon
    sci-training:
      method: Sci
      path: builtin
      config:
        functional-unit: training-runs
    sci-inference:
      method: Sci
      path: builtin
      config:
        functional-unit: thousand-predictions
tree:
  children:
    training:
      children:
        be-average:
          pipeline:
            compute:
            - operational-carbon
            - embodied-carbon
            - total-carbon
            - sci-training
          inputs:
          - timestamp: '2026-11-24T13:27:40Z'
            duration: 16
            time: 15.624415800000861
            energy: 0.0003047170920462037
            grid/carbon-intensity: 181.7
            training-runs: 100.0
